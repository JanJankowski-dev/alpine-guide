databaseChangeLog:
  - changeSet:
      id: "1"
      author: "j.jankowski"
      changes:
        - createTable:
            tableName: "trips"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "start_date"
                  type: "date"
                  constraints:
                    nullable: false
              - column:
                  name: "end_date"
                  type: "date"
                  constraints:
                    nullable: false
              - column:
                  name: "description"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
